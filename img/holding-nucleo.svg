<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" aria-hidden="true">
  <defs>
    <radialGradient id="cielo" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#16243f"/>
      <stop offset=".55" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#060b14"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset=".25" stop-color="#e7b65a" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#c9973e" stop-opacity=".12"/>
      <stop offset="1" stop-color="#c9973e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a1"/>
      <stop offset=".5" stop-color="#e7b65a"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="haz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7b65a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7b65a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e7b65a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodo" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#244a7a"/>
      <stop offset="1" stop-color="#0b1424"/>
    </radialGradient>
    <g id="sat">
      <circle r="34" fill="url(#nodo)" stroke="#e7b65a" stroke-opacity=".7" stroke-width="1.5"/>
      <circle r="42" fill="none" stroke="#4fd1c5" stroke-opacity=".25" stroke-width="1"/>
    </g>
  </defs>

  <rect width="1200" height="600" fill="url(#cielo)"/>

  <g fill="#fff" opacity=".55">
    <circle cx="90" cy="70" r="1.2"/><circle cx="210" cy="140" r=".9"/><circle cx="330" cy="50" r="1.1"/>
    <circle cx="470" cy="110" r=".8"/><circle cx="760" cy="60" r="1.2"/><circle cx="880" cy="130" r=".9"/>
    <circle cx="1010" cy="80" r="1.1"/><circle cx="1120" cy="160" r=".8"/><circle cx="150" cy="260" r=".8"/>
    <circle cx="1060" cy="300" r=".9"/><circle cx="620" cy="40" r=".7"/><circle cx="40" cy="190" r=".9"/>
  </g>

  <!-- base de crecimiento: barras que suben de izquierda a derecha -->
  <g fill="url(#barra)">
    <rect x="60" y="520" width="26" height="80"/><rect x="100" y="505" width="26" height="95"/>
    <rect x="140" y="512" width="26" height="88"/><rect x="180" y="492" width="26" height="108"/>
    <rect x="220" y="480" width="26" height="120"/><rect x="260" y="486" width="26" height="114"/>
    <rect x="300" y="466" width="26" height="134"/><rect x="340" y="452" width="26" height="148"/>
    <rect x="854" y="452" width="26" height="148"/><rect x="894" y="440" width="26" height="160"/>
    <rect x="934" y="446" width="26" height="154"/><rect x="974" y="424" width="26" height="176"/>
    <rect x="1014" y="410" width="26" height="190"/><rect x="1054" y="398" width="26" height="202"/>
    <rect x="1094" y="380" width="26" height="220"/><rect x="1134" y="360" width="26" height="240"/>
  </g>
  <path d="M0 560 L1200 560" stroke="#e7b65a" stroke-opacity=".5" stroke-width="1"/>
  <g stroke="#e7b65a" stroke-opacity=".12" stroke-width="1">
    <path d="M600 560 L0 600"/><path d="M600 560 L300 600"/><path d="M600 560 L900 600"/><path d="M600 560 L1200 600"/>
  </g>

  <!-- órbitas -->
  <g fill="none" stroke="#8fb3d9" stroke-opacity=".22">
    <ellipse cx="600" cy="285" rx="190" ry="120"/>
    <ellipse cx="600" cy="285" rx="330" ry="200" stroke-dasharray="2 7"/>
    <ellipse cx="600" cy="285" rx="470" ry="250" stroke-opacity=".12"/>
  </g>

  <!-- haces del núcleo a cada negocio -->
  <g stroke="url(#haz)" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M600 285 Q520 200 420 170"/>
    <path d="M600 285 Q690 200 790 170"/>
    <path d="M600 285 Q470 300 300 290"/>
    <path d="M600 285 Q740 300 905 290"/>
    <path d="M600 285 Q520 380 430 420"/>
    <path d="M600 285 Q690 380 780 420"/>
    <path d="M600 285 Q600 150 600 90"/>
  </g>

  <!-- núcleo: el holding -->
  <circle cx="600" cy="285" r="150" fill="url(#halo)"/>
  <g transform="translate(600 285)">
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="#0b1424" stroke="url(#oro)" stroke-width="3"/>
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="url(#oro)" opacity=".92"/>
    <polygon points="0,-40 35,-20 0,0 -35,-20" fill="#fff" opacity=".18"/>
    <circle r="78" fill="none" stroke="#e7b65a" stroke-opacity=".35" stroke-width="1"/>
  </g>

  <!-- negocios nicho alrededor del núcleo -->
  <g font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Arial" font-size="15" fill="#e8eef7" text-anchor="middle" letter-spacing=".04em">
    <g transform="translate(420 170)"><use href="#sat"/>
      <path d="M-15 8 L-7 -2 L1 4 L14 -12" stroke="#e7b65a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="62">Bots de trading</text></g>
    <g transform="translate(790 170)"><use href="#sat"/>
      <circle r="13" fill="none" stroke="#e7b65a" stroke-width="3"/><path d="M-4 -6 L-4 6 M3 -6 L3 6 M-7 -3 L5 -3 Q9 -3 9 0 Q9 3 5 3 L-7 3" stroke="#e7b65a" stroke-width="2" fill="none"/>
      <text y="62">Cripto</text></g>
    <g transform="translate(300 290)"><use href="#sat"/>
      <rect x="-14" y="-4" width="6" height="14" fill="#e7b65a"/><rect x="-3" y="-11" width="6" height="21" fill="#e7b65a"/><rect x="8" y="-16" width="6" height="26" fill="#e7b65a"/>
      <text y="62">Datos</text></g>
    <g transform="translate(905 290)"><use href="#sat"/>
      <rect x="-16" y="-12" width="32" height="24" rx="4" fill="none" stroke="#e7b65a" stroke-width="2.5"/><path d="M-16 -5 L16 -5" stroke="#e7b65a" stroke-width="2"/><circle cx="-11" cy="-8.5" r="1.4" fill="#e7b65a"/>
      <text y="62">Webs</text></g>
    <g transform="translate(430 420)"><use href="#sat"/>
      <circle cx="-3" cy="-3" r="10" fill="none" stroke="#e7b65a" stroke-width="3"/><path d="M5 5 L13 13" stroke="#e7b65a" stroke-width="3.5" stroke-linecap="round"/>
      <text y="62">Investigación</text></g>
    <g transform="translate(780 420)"><use href="#sat"/>
      <circle r="13" fill="none" stroke="#e7b65a" stroke-width="3"/><path d="M0 -7 L0 0 L6 4" stroke="#e7b65a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text y="62">Automatización</text></g>
    <g transform="translate(600 90)"><use href="#sat"/>
      <path d="M0 -14 L4 -4 L15 -4 L6 3 L9 14 L0 7 L-9 14 L-6 3 L-15 -4 L-4 -4 Z" fill="#e7b65a"/>
      <text y="-48">Incubadora</text></g>
  </g>

  <g fill="#4fd1c5">
    <circle cx="510" cy="225" r="3"/><circle cx="700" cy="230" r="3"/><circle cx="450" cy="296" r="3"/>
    <circle cx="760" cy="297" r="3"/><circle cx="520" cy="355" r="3"/><circle cx="690" cy="355" r="3"/><circle cx="600" cy="170" r="3"/>
  </g>
</svg>
